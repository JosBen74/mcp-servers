[project]
name = "google-docs-mcp"
version = "1.1.0"
description = "MCP server for Google Docs API — create, read, edit and list Google Docs documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lansstyrelsen Vastra Gotaland", email = "josef@lansstyrelsen.se" }
]

dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.0.0",
]

[project.scripts]
google-docs-mcp = "google_docs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_docs_mcp"]
