[project]
name = "shark-mcp"
version = "1.0.0"
description = "MCP server för SHARK kustvattendata från SMHI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Länsstyrelsen Västra Götaland", email = "josef@lansstyrelsen.se" }
]

dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
shark-mcp = "shark_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
